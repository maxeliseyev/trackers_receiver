version: "3.8"

services:
  receiver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackers-receiver
    restart: unless-stopped
    ports:
      - "36000:36000"
    env_file:
      - ./.env
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 2G
